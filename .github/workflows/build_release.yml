name: Build Release APK

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Release APK
        run: ./gradlew assembleStableRelease

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -n 1)
          echo "Using Android build-tools from: $BUILD_TOOLS_DIR"

          for apk in app/build/outputs/apk/stable/release/*-unsigned.apk; do
            if [ -f "$apk" ]; then
              aligned="${apk%-unsigned.apk}-aligned.apk"
              signed="${apk%-unsigned.apk}-signed.apk"
              $BUILD_TOOLS_DIR/zipalign -v -p 4 "$apk" "$aligned"
              $BUILD_TOOLS_DIR/apksigner sign \
                --ks release.jks \
                --ks-key-alias "$KEY_ALIAS" \
                --ks-pass "pass:$STORE_PASSWORD" \
                --key-pass "pass:$KEY_PASSWORD" \
                --out "$signed" "$aligned"
              echo "Signed APK created: $signed"
            fi
          done
          rm -f release.jks

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cloudstream-release-signed
          path: app/build/outputs/apk/stable/release/*-signed.apk
